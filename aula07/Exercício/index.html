<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Tabela Estados</h1>

    

    <table>

        <caption>Sudeste x Sul</caption>

        <thead>
            <tr>

                <th>Cidades</th>

        <tbody>
            <tr>
                <td rowspan="12">Sudeste</td>
                <td rowspan="3">São Paulo</td>

            </tr>

            <tr>
                <td>Guarulhos</td>
            </tr>

            <tr>
                <td>Campinas</td>
            </tr>

            <tr>
                <td rowspan="3">Rio de Janeiro</td>
                <td>Rio de Janeiro</td>
            </tr>

            <tr>
                <td>São Gonçalo</td>
            </tr>

            <tr>
                <td>Duque de Caxias</td>
            </tr>

            <tr>
                <td rowspan="3">Minas Gerais</td>
                <td>Belo Horizonte</td>
            </tr>

            <tr>
                <td>Uberlândia</td>
            </tr>

            <tr>
                <td>Contagem</td>
            </tr>

            <tr>
                <td rowspan="3">Espirito Santo</td>
                <td>Vila Velha</td>
            </tr>

            <tr>
                <td>Serra</td>
            </tr>

            <tr>
                <td>Cariacica</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
